; Plan de marcación.
; Las llamadas salientes del agente NO pasan por aquí: ARI las origina
; directamente con PJSIP/<número>@troncal y las envía a la aplicación "banpi".

[general]
static = yes
writeprotect = yes

[desde-troncal]
; Llamadas ENTRANTES a tu número (por ejemplo, un cliente que devuelve la llamada).
; Por defecto se cuelga. Lo recomendable es desviarlas a un teléfono de la empresa:
;   exten => _X.,1,Dial(PJSIP/600000000@troncal,30)
exten => _X.,1,NoOp(Llamada entrante de ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Hangup()

[prueba]
; Cliente simulado para la prueba de extremo a extremo (tests/test_e2e_asterisk.py):
; contesta, espera a que termine el saludo y dice la frase de custom/cliente.wav.
exten => 100,1,Answer()
 same => n,Wait(${IF($["${ESPERA}" = ""]?14:${ESPERA})})
 same => n,Playback(custom/cliente)
 same => n,Wait(20)
 same => n,Hangup()
