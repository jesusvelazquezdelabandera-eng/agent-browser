; Troncal SIP con tu proveedor. Sustituye en TODO el archivo:
;   SIP_SERVIDOR  -> servidor SIP del proveedor (por ejemplo sip.proveedor.com)
;   SIP_USUARIO   -> usuario o número de la cuenta SIP
;   SIP_PASSWORD  -> contraseña de la cuenta SIP
; Los nombres "troncal" deben coincidir con SIP_ENDPOINT del .env (PJSIP/{numero}@troncal).

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; Si la máquina está detrás de un router (NAT), descomenta y pon tu IP pública y tu red local:
;external_media_address = TU_IP_PUBLICA
;external_signaling_address = TU_IP_PUBLICA
;local_net = 192.168.0.0/16

[troncal-registro]
type = registration
transport = transport-udp
outbound_auth = troncal-auth
server_uri = sip:SIP_SERVIDOR
client_uri = sip:SIP_USUARIO@SIP_SERVIDOR
retry_interval = 60

[troncal-auth]
type = auth
auth_type = userpass
username = SIP_USUARIO
password = SIP_PASSWORD

[troncal]
type = aor
contact = sip:SIP_SERVIDOR
qualify_frequency = 60

[troncal]
type = endpoint
transport = transport-udp
context = desde-troncal
disallow = all
allow = alaw,ulaw
outbound_auth = troncal-auth
aors = troncal
from_user = SIP_USUARIO
from_domain = SIP_SERVIDOR
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733

[troncal-identify]
type = identify
endpoint = troncal
match = SIP_SERVIDOR
